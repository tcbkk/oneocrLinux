[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oneocr-linux"
version = "0.1.0"
description = "Pure ONNX Runtime reimplementation of the Windows OneOCR engine (Linux/CPU)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "numpy>=1.23",
    "onnxruntime>=1.16",
    "pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
oneocr-linux = "oneocr_linux.cli:main"

[tool.setuptools.packages.find]
include = ["oneocr_linux*"]